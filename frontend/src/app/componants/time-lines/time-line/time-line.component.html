<div class="container">
  <div class="timeline">

    <app-time-line-profile></app-time-line-profile>

    <div id="page-contents">
      <div class="row">
        <div class="col-md-3"></div>

        <div class="col-md-7">

          <app-publish></app-publish>

          <!-- Empty State -->
          <div *ngIf="posts.length === 0">
            No posts found.
          </div>

          <!-- Posts -->
          <div class="post-content" *ngFor="let post of posts">

            <div class="post-date hidden-xs hidden-sm">

              <h5 style="margin-left: -10px">{{ user.username }}</h5>
              <p class="text-muted">{{ post.CreatedAt | date:'short' }}</p>
            </div>

            <img [src]="srcImg + post.mediaPath" alt="post-image" class="post-image">

            <div class="post-container">
              <img [src]="srcImg + user.profileImagePath" alt="user" class="profile-photo-md">

              <div class="post-detail">



                <div class="reaction">
                  <a class="btn text-green"><i class="icon ion-thumbsup"></i> 13</a>
                  <a class="btn text-red"><i class="fa fa-thumbs-down"></i> 0</a>
                </div>

                <div class="line-divider"></div>

                <div class="post-text">
                  <p>{{ post.Content }}</p>
                </div>
                <div class="user-info">
                  <h5><a routerLink="/timeline" class="profile-link">{{ user.username }}</a></h5>
                  <p class="text-muted">Published a photo {{ post.CreatedAt | amTimeAgo }}</p>
                </div>
                <div class="line-divider"></div>

              </div>
            </div>

          </div>

          <!-- Pagination -->
          <div class="pagination-container">
            <button (click)="prevPage()" [disabled]="currentPage === 1">Prev</button>

            <button
              *ngFor="let page of [].constructor(totalPages); let i = index"
              (click)="goToPage(i + 1)"
              [class.active]="currentPage === i + 1">
              {{ i + 1 }}
            </button>

            <button (click)="nextPage()" [disabled]="currentPage === totalPages">Next</button>
          </div>

        </div>

        <app-time-line-detailes></app-time-line-detailes>

      </div>
    </div>

  </div>
</div>
